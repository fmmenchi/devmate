name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  # @fmmenchi/* installs from GitHub Packages, which asks for a token even for
  # public packages.
  packages: read

env:
  HUSKY: 0

jobs:
  # The same gate as local and pre-push (ADR 0002): CI is only the place where
  # it cannot be skipped. Bricks pinned by commit SHA, never a movable tag.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # .nvmrc stays the single source for the Node version; the brick takes a string.
      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      # gh-actions/v0.4.6
      - uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/setup@f7bc4279e88a10255550cacb435ea5397e8410d6
        with:
          node-version: ${{ steps.node.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          registry-url: https://npm.pkg.github.com

      - run: pnpm run check
